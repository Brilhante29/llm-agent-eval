id: 9
name: llm-agent-eval
program:
  id: ai-evaluation-retrieval
  narrative_fit: Runs and evaluates a local tool-routing agent inside the AI Evaluation and RAG Platform.
  shared_assets:
    - execution trace contract
    - strict local evaluator
    - portfolio-compatible benchmark result
status: published
claim: Local-first tool-routing agent and offline harness with pinned model provenance, observed tool calls, latency, and cost.
stack:
  - python
  - jsonl
  - ollama
  - openai-compatible-http
  - unittest
  - docker
language_profile:
  primary: python
  secondary: []
  reason: Trace validation and deterministic evaluation are packaged as testable Python use cases with a CLI.
decision_brain:
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: backlog_recorded
  principles:
    coupling_rule: The planner adapter emits provider-neutral traces; evaluation never imports model transport or tool execution.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Use one planner step and bounded tools; failures remain visible without fallback answers.
    testability_rule: Tests replace HTTP transport and use temporary JSONL records without network or credentials.
  stack_profile: python
  api_style: cli-first
  messaging: none
  cloud:
    mode: local-first-pluggable
    local_provider: ollama
    real_provider_target: openai-compatible-endpoint
    adapter_rule: Planner runtimes export the trace contract instead of entering the scoring core.
  database: fixture-files
  runtime: python-cli
  library_policy: Use standard-library HTTP and bounded in-process tools; provider SDKs do not enter the core.
  record_path: sdd/technical-decision.md
architecture:
  style: functional-core-imperative-shell
  reason: Agent execution is an imperative graph; validation and scoring remain pure policies around trace files.
  dependency_rule: The planner depends on an OpenAI-compatible port; tools and evaluator do not depend on the provider.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [catalog, programs, decision-brain, reuse-improvement-loop, architecture, language-profiles, design-system, sdd, harness, templates, skills]
benchmark:
  primary_metric: task_success_rate
  unit: ratio
  command: python -m llm_agent_eval benchmark --tasks data/fixtures/tasks.jsonl --traces data/fixtures/traces.jsonl --output benchmarks/results/agent-eval-baseline.json
  result_path: benchmarks/publication/agent-eval-baseline-v2.json
release:
  docker: Dockerfile
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
